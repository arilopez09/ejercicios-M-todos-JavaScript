<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operaciones</title>
</head>
<body>

    <script>
        let N1 = Number(prompt('introduce el primer numero'));
        let N2 = Number(prompt('introduce el segundo numero'));

        let suma = N1 + N2;
        let resta = N1 - N2;
        let multiplicacion = N1 * N2;
        let division = N1 / N2;

        document.write("<h1>Suma</h1>");
        document.write("El resultado es: " + suma + "<br><br>");

        document.write("<h2>Resta</h2>");
        document.write("El resultado es: " + resta + "<br><br>");

        document.write("<h2>Multiplicacion</h2>");
        document.write("El resultado es: " + multiplicacion + "<br><br>");

        document.write("<h2>Division</h2>");
        document.write("El resultado es: " + division);
    </script>

</body>
</html>
