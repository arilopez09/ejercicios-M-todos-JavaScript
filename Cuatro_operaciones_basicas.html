<!DOCTYPE html>
<html><body><script>
let c1 = parseFloat(prompt("Calificación 1:"));
let c2 = parseFloat(prompt("Calificación 2:"));
let c3 = parseFloat(prompt("Calificación 3:"));
let promedio = (c1 + c2 + c3) / 3;

if(promedio >= 6){
  alert("Aprobó con promedio: " + promedio);
} else {
  alert("Esfuérzate más, promedio: " + promedio);
}
</script></body></html>
