<!DOCTYPE html>
<html><body><script>
let n1 = parseFloat(prompt("Primer número:"));
let n2 = parseFloat(prompt("Segundo número:"));
let op = prompt("Elige operación: suma, resta, multi, divi");
switch(op){
  case "suma": alert("Resultado: " + (n1 + n2)); break;
  case "resta": alert("Resultado: " + (n1 - n2)); break;
  case "multi": alert("Resultado: " + (n1 * n2)); break;
  case "divi": alert("Resultado: " + (n1 / n2)); break;
}
</script></body></html>
