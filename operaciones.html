<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Suma</h1>
    <script>

        let N1= Number(prompt("Introduce el primer número"));
        let N2= Number(prompt("Introduce el segundo número"));


        suma= N1+N2;
        document.write("El valor es:"+suma+ "<br><br>")

        resta= N1-N2;
        document.write("La resta es: "+ resta+"<br><br>" );

        multiplicacion= N1*N2;
        document.write("La multiplicación es: " + multiplicacion + "<br><br>");

        division= N1/N2;
        document.write("La división es: " + division);

    </script>
</body>
</html>
