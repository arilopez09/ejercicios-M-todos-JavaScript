html<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datos</title>
</head>
<body>
    <h1>Datos.html</h1>

    <script>
     
        let nombre = prompt("Escribe tu nombre");
        let edad = prompt("Escribe tu edad");
        let especialidad = prompt("Escriba la especialidad");
        let direccion = prompt("Escribe la direccion de la calle");
        
        document.write("Nombre: " + nombre + "<br>");
        document.write("Edad: " + edad + "<br>");
        document.write("Especialidad: " + especialidad + "<br>");
        document.write("Dirección: " + direccion + "<br>");

        alert("Hola " + nombre + ", tus datos han sido registrados.");
    </script>

</body>
</html>
